version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/examples/cinematic-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
  - package-ecosystem: "npm"
    directory: "/examples/saas-workspace"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
  - package-ecosystem: "npm"
    directory: "/examples/home-digital-twin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
  - package-ecosystem: "npm"
    directory: "/tests/browser"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
