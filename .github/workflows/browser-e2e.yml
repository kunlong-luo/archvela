name: Browser E2E — three starters

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"
          run_install: false
      - name: Install Playwright test runner
        run: pnpm --dir tests/browser install --frozen-lockfile
      - name: Install Chromium + system browser dependencies
        run: pnpm --dir tests/browser exec playwright install --with-deps chromium
      - name: Install and build three independent frontends
        shell: bash
        run: |
          set -euo pipefail
          for app in cinematic-site saas-workspace home-digital-twin; do
            pnpm --dir "examples/$app" install --frozen-lockfile
            pnpm --dir "examples/$app" run build
          done
      - name: Run desktop + mobile browser acceptance for each app
        shell: bash
        run: |
          set -euo pipefail
          for app in cinematic-site saas-workspace home-digital-twin; do
            echo "::group::Playwright $app"
            ARCHVELA_EXAMPLE="$app" pnpm --dir tests/browser test
            echo "::endgroup::"
          done
      - name: Upload browser screenshots, traces and HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: archvela-browser-failures
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: ignore
