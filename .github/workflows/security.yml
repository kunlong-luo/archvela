name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "13 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL static analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  pnpm-audit:
    name: pnpm vulnerability audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cinematic-site, saas-workspace, home-digital-twin, browser-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "10.22.0"
          run_install: false
      - name: Audit locked production and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            browser-tests) directory="tests/browser";;
            *) directory="examples/${{ matrix.package }}";;
          esac
          test -s "$directory/pnpm-lock.yaml" || {
            echo "::error::Missing lockfile for $directory"
            exit 1
          }
          # Audit production and development dependencies from the frozen pnpm graph.
          pnpm --dir "$directory" audit --audit-level high

  installed-license-evidence:
    name: Installed license-file evidence (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cinematic-site, saas-workspace, home-digital-twin, browser-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "10.22.0"
          run_install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked packages without running third-party lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.package }}" in
            browser-tests) directory="tests/browser";;
            *) directory="examples/${{ matrix.package }}";;
          esac
          pnpm --dir "$directory" install --frozen-lockfile --ignore-scripts
          python3 scripts/collect_pnpm_license_evidence.py \
            --directory "$directory" \
            --output "$RUNNER_TEMP/installed-license-evidence-${{ matrix.package }}.json"
      - name: Upload installed LICENSE/NOTICE hashes and unresolved findings
        uses: actions/upload-artifact@v7
        with:
          name: installed-license-evidence-${{ matrix.package }}
          path: ${{ runner.temp }}/installed-license-evidence-${{ matrix.package }}.json
          if-no-files-found: error
          retention-days: 14

  dependency-graph-capability:
    name: Dependency Graph availability (repository owner action if disabled)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Inspect GitHub Dependency Graph availability
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/archvela-sbom-response.json" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")
          if [[ "$code" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Dependency Graph is available; running PR dependency review."
          elif [[ "$code" == "404" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is unavailable. Enable it in repository Settings > Security & analysis; PR dependency-review cannot run until then. pnpm audit and CodeQL still enforce security checks."
            echo "DEPENDENCY REVIEW PENDING OWNER SETTING" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot determine Dependency Graph availability (HTTP $code). Do not silently bypass dependency review."
            exit 1
          fi

  dependency-review:
    name: Dependency review (requires GitHub Dependency Graph)
    if: github.event_name == 'pull_request' && needs.dependency-graph-capability.outputs.enabled == 'true'
    needs: [dependency-graph-capability]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
