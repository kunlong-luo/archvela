name: Verify dependency lockfiles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"
          run_install: false
      - name: Check pnpm lockfile consistency
        shell: bash
        run: |
          set -euo pipefail
          for folder in examples/cinematic-site examples/saas-workspace examples/home-digital-twin tests/browser; do
            test -s "$folder/pnpm-lock.yaml"
            test ! -f "$folder/package-lock.json"
            pnpm --dir "$folder" install --lockfile-only --ignore-scripts --frozen-lockfile
          done
          git diff --exit-code -- examples tests
