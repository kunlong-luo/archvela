# One-time cleanup, scoped to the exact workflow file added by the audited PR.
# This workflow has no pull_request trigger and can never run untrusted PR code.
# Remove this privileged one-off workflow after verifying the cleanup run.
name: One-time verified merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: read

concurrency:
  group: archvela-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'kunlong-luo/archvela' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify merged PRs, pinned branch heads, ancestry and protections before deleting
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/prune_merged_branches.py \
            --expect-sha "$GITHUB_SHA" \
            --execute
