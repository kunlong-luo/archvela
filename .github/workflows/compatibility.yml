name: Cross-Agent Skill Installer Compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-agent-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"
          run_install: false
      - name: Install upstream Skills CLI in isolated runner directory
        run: |
          mkdir -p "$RUNNER_TEMP/skills-cli"
          printf '%s\n' '{"name":"archvela-cli-smoke","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/skills-cli/package.json"
          pnpm --dir "$RUNNER_TEMP/skills-cli" add --save-exact skills@1.7.4
          "$RUNNER_TEMP/skills-cli/node_modules/.bin/skills" --version
      - name: Check project installations for 20 agents and global paths for 6 key agents
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          python3 scripts/verify_agent_installs.py \
            --skills-cli "$RUNNER_TEMP/skills-cli/node_modules/.bin/skills" \
            --source "$GITHUB_WORKSPACE" \
            --global-smoke \
            --json-out "$RUNNER_TEMP/archvela-agent-results.json"
      - name: Verify public GitHub one-command install for Codex, Claude Code and OpenCode
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archvela-public-install"
          cd "$RUNNER_TEMP/archvela-public-install"
          "$RUNNER_TEMP/skills-cli/node_modules/.bin/skills" add kunlong-luo/archvela \
            --skill archvela-architect \
            --agent codex --agent claude-code --agent opencode \
            --copy --yes
          for expected in \
            .agents/skills/archvela-architect/SKILL.md \
            .claude/skills/archvela-architect/SKILL.md \
            .agents/skills/archvela-architect/references/scenarios.json; do
            test -s "$expected" || {
              echo "::error::Public-source install missing $expected"
              exit 1
            }
          done
          python3 -c 'import json; from pathlib import Path; x=json.loads(Path(".agents/skills/archvela-architect/references/scenarios.json").read_text()); assert len(x) == 62'
      - name: Verify pinned GitHub commit skill source used in real-agent pilots
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archvela-pinned-install"
          cd "$RUNNER_TEMP/archvela-pinned-install"
          "$RUNNER_TEMP/skills-cli/node_modules/.bin/skills" add \
            "https://github.com/kunlong-luo/archvela/tree/$GITHUB_SHA/.agents/skills/archvela-architect" \
            --skill archvela-architect --agent codex --copy --yes
          test -s .agents/skills/archvela-architect/SKILL.md || {
            echo "::error::Pinned GitHub commit Skill install failed"
            exit 1
          }
          # Verify bytes against the exact checked-out source, not merely file existence.
          # A successful GitHub-source install at a pinned ref is not L2 native discovery.
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::Checked-out source does not match the pinned PR/main commit"
            exit 1
          }
          for relative in \
            SKILL.md \
            references/scenarios.json \
            references/architecture_profiles.json \
            scripts/scenes.py \
            scripts/new_project_docs.py; do
            expected="$GITHUB_WORKSPACE/.agents/skills/archvela-architect/$relative"
            installed=".agents/skills/archvela-architect/$relative"
            test -s "$expected" && test -s "$installed" && cmp -s "$expected" "$installed" || {
              echo "::error::Installed pinned Skill differs from exact source at $relative"
              exit 1
            }
          done
          echo "Pinned GitHub install matches five files byte-for-byte; no native agent invoked."
      - name: Upload detailed compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-agent-installer-results
          path: ${{ runner.temp }}/archvela-agent-results.json
          if-no-files-found: warn
