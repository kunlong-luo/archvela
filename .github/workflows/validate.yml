name: Validate Archvela Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill and generators
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .agents/skills/archvela-architect/scripts
          python scripts/check_asset_provenance.py
