name: Bootstrap authentic pnpm locks (temporary migration job)
on:
  pull_request:
    paths:
      - '.github/workflows/pnpm-bootstrap.yml'
      - 'examples/**/package.json'
      - 'tests/browser/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"
          run_install: false
      - name: Convert four committed npm locks using real pnpm (no npm CLI)
        shell: bash
        run: |
          set -euo pipefail
          for folder in examples/cinematic-site examples/saas-workspace examples/home-digital-twin tests/browser; do
            echo "::group::Generate $folder"
            (cd "$folder" && pnpm import && pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile)
            test -s "$folder/pnpm-lock.yaml"
            echo "::endgroup::"
          done
      - name: Export generated lock bytes for exact authenticated commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          paths = [
              'examples/cinematic-site/pnpm-lock.yaml',
              'examples/saas-workspace/pnpm-lock.yaml',
              'examples/home-digital-twin/pnpm-lock.yaml',
              'tests/browser/pnpm-lock.yaml'
          ]
          for p in paths:
              raw = Path(p).read_bytes()
              print('ARCHVELA_PNPM_LOCK_META|' + p + '|' + hashlib.sha256(raw).hexdigest() + '|' + str(len(raw)))
              value = raw.decode('utf-8')
              for i, start in enumerate(range(0, len(value), 900)):
                  print('ARCHVELA_PNPM_LOCK_CHUNK|' + p + '|' + str(i) + '|' + json.dumps(value[start:start+900], ensure_ascii=True))
              print('ARCHVELA_PNPM_LOCK_END|' + p)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: authentic-pnpm-import-lockfiles
          path: |
            examples/cinematic-site/pnpm-lock.yaml
            examples/saas-workspace/pnpm-lock.yaml
            examples/home-digital-twin/pnpm-lock.yaml
            tests/browser/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 14
